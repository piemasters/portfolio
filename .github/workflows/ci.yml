name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel a superseded run on the same branch so a pull request waits on the latest commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # Require this job in the main branch ruleset. It fails unless both suites pass.
  ci:
    name: CI
    needs: [unit, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require unit and end-to-end tests
        run: |
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
